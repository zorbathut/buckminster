# CI: the M3 test matrix on Linux, plus the M5 Windows build check.
#
# First executed 2026-07-11 (run 29169258662): green on the first try, all six matrix cells, ~2m15s.
#
# Discipline notes:
# - Do NOT add raw cargo steps here: rustup resolves rust-toolchain.toml from the invocation cwd, and a root-cwd cargo call silently uses the runner's default toolchain instead of the pin. All cargo invocations belong inside the tools (they run with cwd=src/).
# - global.json (rollForward latestPatch) pins the SDK to the verified 10.0.1xx band; the runner image preinstalls a 10.0.1xx SDK, and the workload's emscripten pack must match the pin in docs/wasm-toolchain.md's matched set.
# - The workload install is a known .NET 10 footgun class (workload-set manifest skew, dotnet/sdk#52090; `dotnet workload restore` is the occasional nudge). Fallback if the sudo route proves flaky: drop the system SDK from PATH and let the tool bootstrap provision a user-local ~/.dotnet, where ensure_dotnet_wasm auto-installs the workload without sudo.
name: ci
on:
  push:
  pull_request:

jobs:
  test-all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Node 24 is the pinned matched-set dimension (docs/wasm-toolchain.md): it hosts the wasm-desktop target and runs the wasm test suites. Pinned explicitly rather than trusting the runner default, which changes under us.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the wasm-tools workload
        run: sudo dotnet workload install wasm-tools
      - name: Static gates (pyright strict, rustfmt, clippy)
        run: ./tool.bat check
      - name: Full test matrix
        run: ./tool.bat test-all

  # The M5 Windows build check (PLAN M5 item 4): build-only, not the test matrix -- the daily matrix stays Linux, Windows proves the toolchain and the .dll wiring compile+link. Runs tool.bat's cmd branch deliberately (the path a Windows user double-clicks); its on-failure pause is CI-defused inside tool.bat.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Build (native + wasm + solution)
        shell: cmd
        run: .\tool.bat build
