# Exact-version pin, honored because the tool entry point always resolves cargo through rustup (tools/toolchains.py). Bumps are deliberate: update the version, rebuild everything, run the full test matrix per docs/wasm-toolchain.md's checklist -- rustc is one component of the matched rustc/emsdk/.NET/Node set pinned there.
[toolchain]
channel = "1.96.1"
# rustup auto-installs listed targets/components on first cargo use, so these need no provisioning code. The components entry is load-bearing: the bootstrap installs rustup with --profile minimal, which omits clippy and rustfmt -- without this line, `./tool.bat check` breaks on every fresh machine.
targets = ["wasm32-unknown-emscripten"]
components = ["clippy", "rustfmt"]
