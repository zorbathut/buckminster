[package]
name = "buckminster-host-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Module layout convention: language subdirs inside src/<module>/, so the crate root lives in rust/ rather than cargo's default src/.
[lib]
path = "rust/lib.rs"
# The desktop executor artifact (host-as-executor composition): C# loads one agreed library name -- "buckminster" -- no matter which executor built it, because the [LibraryImport] constant is baked into shared assemblies. It cannot be "buckminster_core": core's own rlib already claims that filename in the shared target dir (cargo output-filename collision, unspecified winner, slated to become a hard error -- rust-lang/cargo#6313). rlib is for this crate's own tests.
name = "buckminster"
crate-type = ["cdylib", "rlib"]

[features]
# Dump-only FFI metadata registration, forwarded: the #[cfg(feature = "ffi-dump")] the buck_* macros emit evaluates in the EXPORTING crate, so this crate needs its own switch; the metadata types it registers live behind core's.
ffi-dump = ["buckminster-core/ffi-dump"]

[dependencies]
buckminster-core = { path = "../core" }
# The logging facade: the platform layer's diagnostics ride the same process-global pipeline as everything else.
log = "0.4"
# winit, pinned exact: 0.31 is a breaking redesign in beta (dyn traits, moved pump module) and the pump-events surface is version-sensitive. This crate is native-only by construction (the wasm executor never links it), so no emscripten target-gating is needed.
winit = "=0.30.13"
# softbuffer is the interim window-clear presenter: Wayland never MAPS a window until a buffer is committed, so an unpainted window is invisible (taskbar entry, no surface). One solid-color present on RedrawRequested makes windows real; M6's WebGPU surface replaces it.
softbuffer = "0.4"
