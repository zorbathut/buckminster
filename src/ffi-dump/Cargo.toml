[package]
name = "buckminster-ffi-dump"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Module layout convention: language subdirs inside src/<module>/, so the crate root lives in rust/ rather than cargo's default src/.
[[bin]]
name = "buckminster-ffi-dump"
path = "rust/main.rs"

[dependencies]
# Feature-union rule (PLAN.md, binding-generation entry): the dump must see every feature-gated export, so this dependency lists the union of each exporting crate's features. Core: ffi-dump (the registration switch) plus window (default-on anyway, listed so turning the default off can't silently shrink the dump).
buckminster-core = { path = "../core", features = ["ffi-dump", "window"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
